services:
  - type: web
    name: gocrew-engine
    runtime: go
    plan: starter
    region: oregon
    branch: deploy/render
    rootDir: /
    buildCommand: "go build -o /tmp/gocrew-server ./cmd/server"
    startCommand: "/tmp/gocrew-server"
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: API_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: CREW_GO_LOG_FORMAT
        value: "json"
      - key: CREW_GO_LOG_LEVEL
        value: "info"
      - key: REDIS_BACKEND
        value: "dragonfly"
      # Set these in the Render dashboard (secrets, never in repo):
      # - key: API_AUTH_TOKEN
      #   sync: false
      # - key: REDIS_ADDR
      #   sync: false   # e.g. Dragonfly Cloud endpoint or private service host:port
      # - key: REDIS_PASSWORD
      #   sync: false
      # - key: JWT_SECRET
      #   sync: false
