name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod tidy
      - run: go build ./pkg/... ./cmd/...
      - run: go test ./pkg/... -v -count=1
      - run: go test ./pkg/... -race -count=1
