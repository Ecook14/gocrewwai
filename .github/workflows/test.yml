name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod tidy
      - run: go build ./pkg/... ./cmd/... ./gocrew/...
      - name: Test without race
        env:
          CREW_CONFIG_PATH: config.json
        run: go test ./pkg/... ./cmd/... ./gocrew/... -v -count=1
      - name: Test with race detector
        env:
          CREW_CONFIG_PATH: config.json
        run: go test ./pkg/... ./cmd/... ./gocrew/... -race -count=1 -timeout 120s
