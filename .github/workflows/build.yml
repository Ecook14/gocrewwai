name: Build and Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./pkg/... ./cmd/...
      - name: Test
        env:
          CREW_CONFIG_PATH: config.json
        run: go test ./pkg/... ./cmd/... -v -count=1
      - name: Lint
        run: go vet ./pkg/... ./cmd/... ./gocrew/...
      - name: Build binaries
        run: |
          CGO_ENABLED=1 go build -o gocrew-cli ./cmd/gocrew
          CGO_ENABLED=1 go build -o gocrewwai-server ./cmd/server
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gocrew-binaries-${{ matrix.go-version }}
          path: |
            gocrew-cli
            gocrewwai-server

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go mod tidy
      - run: go build ./pkg/... ./cmd/... ./gocrew/...
      - name: Test without race
        env:
          CREW_CONFIG_PATH: config.json
        run: go test ./pkg/... ./cmd/... ./gocrew/... -v -count=1
      - name: Test with race detector
        env:
          CREW_CONFIG_PATH: config.json
        run: go test ./pkg/... ./cmd/... ./gocrew/... -race -count=1 -timeout 120s
