name: KV Compat Matrix
on: [push, pull_request]
jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: dragonfly
            image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.0
          - backend: redis
            image: redis:7-alpine
    services:
      kv:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod download
      - name: Compat suite vs ${{ matrix.backend }}
        env:
          REDIS_BACKEND: ${{ matrix.backend }}
          KV_TEST_ADDR: localhost:6379
        run: go test ./pkg/kv/ -run 'TestCompat|TestConfig|TestDial' -v -count=1
