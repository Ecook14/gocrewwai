name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download dependencies
        run: go mod download
      - name: Build Linux
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o gocrew-cli-linux ./cmd/gocrew
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o gocrewwai-server-linux ./cmd/server
      - name: Build macOS
        run: |
          GOOS=darwin GOARCH=amd64 go build -o gocrew-cli-macos ./cmd/gocrew
          GOOS=darwin GOARCH=amd64 go build -o gocrewwai-server-macos ./cmd/server
      - name: Build Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -o gocrew-cli.exe ./cmd/gocrew
          GOOS=windows GOARCH=amd64 go build -o gocrewwai-server.exe ./cmd/server
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gocrew-cli-linux
            gocrewwai-server-linux
            gocrew-cli-macos
            gocrewwai-server-macos
            gocrew-cli.exe
            gocrewwai-server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
